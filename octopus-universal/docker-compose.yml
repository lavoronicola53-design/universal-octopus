version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: pythagoras-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pythagoras
      POSTGRES_PASSWORD: pythagoras
      POSTGRES_DB: pythagoras
    volumes:
      - pythagoras_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pythagoras"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pythagoras-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: pythagoras-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://pythagoras:pythagoras@db:5432/pythagoras
      REDIS_URL: redis://redis:6379/0
      DATA_PROVIDER: real   # dati reali: Binance (crypto) + Stooq (oro/argento), fallback sintetico
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: development
      SECRET_KEY: change-me-in-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: pythagoras-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pythagoras_pgdata:
